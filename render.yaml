# Render Blueprint:  connect this repo in the Render dashboard.
# WebSockets are supported on all plans. Keep the instance count at 1 —
# rooms live in memory, so a second instance would split the chat.
services:
  - type: web
    name: connect-chat
    runtime: node
    plan: free
    region: singapore
    buildCommand: "echo 'no dependencies to install'"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

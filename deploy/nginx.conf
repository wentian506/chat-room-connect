# /etc/nginx/sites-available/connect  →  ln -s to sites-enabled, then:
#   sudo certbot --nginx -d chat.example.com      (adds TLS, turns this into wss://)
#
# The two Upgrade/Connection lines are what keep the chat realtime. Without them
# the app still works — it silently drops to HTTP polling ("basic mode").
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep idle chat sockets open (default 60s would drop them every minute)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
